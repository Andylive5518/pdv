<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>透明代理控制面板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html { min-height: 100%; }

body {
  min-height: 100vh;
  background: #213447 url('/bootstrap/img/bg_body.png') repeat-x top left;
  color: #d9e6ef;
  font-family: Arial, Helvetica, 'Microsoft YaHei', sans-serif;
  font-size: 13px;
  line-height: 18px;
}

button,
input,
select { font-family: inherit; font-size: 13px; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }

.header {
  max-width: 980px;
  margin: 0 auto;
  padding: 18px 15px 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.header h1 {
  margin: 0;
  color: #fff;
  font-size: 20px;
  line-height: 24px;
  font-weight: normal;
  text-shadow: 0 1px 1px rgba(0,0,0,.75);
}

.header .sub {
  display: block;
  margin-top: 2px;
  color: #9bb4c6;
  font-size: 11px;
  font-family: Consolas, 'Courier New', monospace;
  text-shadow: none;
}

.spacer { flex: 1; }

.refresh-ctl {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #c7d8e5;
  font-size: 12px;
  white-space: nowrap;
}

.refresh-ctl select {
  width: auto;
  height: 25px;
  padding: 2px 5px;
}

.refresh-ctl .tick {
  min-width: 44px;
  color: #ffc35a;
  font-family: Consolas, 'Courier New', monospace;
  text-align: right;
}

.container {
  max-width: 980px;
  margin: 0 auto;
  padding: 14px 15px 8px;
}

.card {
  margin-bottom: 14px;
  border: 1px solid #0b2235;
  border-radius: 4px;
  background: #e9eef2;
  color: #263746;
  box-shadow: 0 1px 0 rgba(255,255,255,.3), 0 2px 8px rgba(0,0,0,.28);
  overflow: hidden;
}

.card-title {
  min-height: 34px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: #fff;
  font-size: 14px;
  font-weight: bold;
  text-shadow: 0 -1px 0 rgba(0,0,0,.55);
  border-bottom: 1px solid #0a263b;
  background: linear-gradient(#2f5f83, #174463 48%, #0e324b);
}

.card-title .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
  background: #8699a7;
  box-shadow: 0 0 0 1px rgba(255,255,255,.28), inset 0 1px 1px rgba(0,0,0,.3);
}

.card-title .dot.green { background: #28a745; }
.card-title .dot.red { background: #d9534f; }
.card-title .dot.gray { background: #8d9aa3; }

.card-body { padding: 12px; }

.grid {
  display: grid;
  grid-template-columns: 145px minmax(0, 1fr);
  border-top: 1px solid #c7d1d9;
  border-left: 1px solid #c7d1d9;
  background: #fff;
}

.grid .lbl,
.grid .val {
  min-height: 32px;
  padding: 7px 9px;
  border-right: 1px solid #c7d1d9;
  border-bottom: 1px solid #c7d1d9;
  display: flex;
  align-items: center;
}

.grid .lbl {
  color: #33536b;
  font-weight: bold;
  background: #dbe5ec;
}

.grid .val {
  color: #23313c;
  background: #f7f9fa;
  word-break: break-word;
}

.badge {
  display: inline-block;
  min-width: 48px;
  padding: 2px 8px;
  border-radius: 3px;
  color: #fff;
  font-size: 12px;
  font-weight: bold;
  line-height: 18px;
  text-align: center;
  text-shadow: 0 -1px 0 rgba(0,0,0,.35);
}

.badge.ok { background: #468847; }
.badge.err { background: #b94a48; }
.badge.info { background: #3a87ad; }

.btn-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.btn {
  min-height: 28px;
  padding: 4px 12px;
  border: 1px solid #777;
  border-radius: 4px;
  color: #fff;
  font-weight: bold;
  line-height: 18px;
  text-shadow: 0 -1px 0 rgba(0,0,0,.45);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22);
  background: linear-gradient(#7c8a95, #53636f);
}

.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:active:not(:disabled) { box-shadow: inset 0 2px 4px rgba(0,0,0,.25); }

.btn-start,
.btn-save { border-color: #2f662f; background: linear-gradient(#5cb85c, #3c8c3c); }
.btn-stop { border-color: #8b2f2b; background: linear-gradient(#d9534f, #a93f3b); }
.btn-restart { border-color: #a85f13; background: linear-gradient(#f0ad4e, #c97916); }
.btn-health,
.btn-update { border-color: #2f6f93; background: linear-gradient(#5bc0de, #2f86ac); }

.inline-box {
  display: flex;
  gap: 8px;
  align-items: center;
}

.inline-box input { flex: 1; }

input[type="text"],
select {
  width: 100%;
  height: 29px;
  padding: 4px 7px;
  border: 1px solid #9dafbc;
  border-radius: 3px;
  background: #fff;
  color: #202b33;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.08);
  outline: none;
}

input[type="text"]:focus,
select:focus {
  border-color: #4f95bf;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.08), 0 0 4px rgba(82,168,236,.6);
}

.hint {
  margin-top: 6px;
  color: #617789 !important;
  font-size: 11px !important;
  line-height: 17px;
}

#ifaces-list {
  max-height: 190px !important;
  overflow-y: auto !important;
  border: 1px solid #c7d1d9;
  background: #fff;
  padding: 6px 8px;
}

#ifaces-list label {
  display: block !important;
  padding: 5px 4px !important;
  color: #263746;
  font-size: 12px !important;
  line-height: 18px;
  cursor: pointer;
}

#ifaces-list label:nth-child(even) { background: #f4f7f9; }
#ifaces-list input[type="checkbox"] { margin-right: 6px; vertical-align: -2px; }
#ifaces-list span { color: #6e8291 !important; }

.log-area {
  min-height: 170px;
  max-height: 300px;
  overflow-y: auto;
  border: 1px solid #0a263b;
  border-radius: 3px;
  background: #081621;
  color: #d6e2eb;
  padding: 8px 9px;
  font-family: Consolas, 'Courier New', monospace;
  font-size: 12px;
  line-height: 18px;
  white-space: pre-wrap;
  word-break: break-word;
}

.log-area .ts { color: #7892a6; }
.log-area .ok { color: #7fe08b; }
.log-area .err { color: #ff8c86; }
.log-area .warn { color: #ffd071; }

.footer {
  max-width: 980px;
  margin: 0 auto;
  padding: 0 15px 18px;
  color: #8aa2b5;
  font-size: 11px;
  text-align: center;
}

@media (max-width: 640px) {
  .header { align-items: flex-start; flex-direction: column; padding-top: 12px; }
  .spacer { display: none; }
  .refresh-ctl { width: 100%; justify-content: space-between; }
  .container { padding: 10px; }
  .grid { grid-template-columns: 108px minmax(0, 1fr); }
  .grid .lbl,
  .grid .val { padding: 6px 7px; }
  .inline-box { align-items: stretch; flex-direction: column; }
  .btn-row .btn { flex: 1 1 auto; }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>透明代理<span class="sub">chinadns-ng + dns2tcp + ipt2socks</span></h1>
  </div>
  <span class="spacer"></span>
  <div class="refresh-ctl">
    自动刷新
    <select id="refresh-interval" onchange="setRefresh()">
      <option value="0">关闭</option>
      <option value="3" selected>3秒</option>
      <option value="5">5秒</option>
      <option value="10">10秒</option>
      <option value="30">30秒</option>
    </select>
    <span class="tick" id="countdown"></span>
  </div>
</div>

<div class="container">

  <!-- 状态卡片 -->
  <div class="card">
    <div class="card-title">
      <span class="dot gray" id="global-dot"></span>
      <span id="global-status">检测中...</span>
    </div>
    <div class="card-body">
      <div class="grid">
        <div class="lbl">chinadns-ng</div><div class="val"><span class="badge info" id="st-cng">--</span></div>
        <div class="lbl">dns2tcp</div><div class="val"><span class="badge info" id="st-d2t">--</span></div>
        <div class="lbl">ipt2socks</div><div class="val"><span class="badge info" id="st-i2s">--</span></div>
        <div class="lbl">chnroute</div><div class="val" id="st-ipset">--</div>
        <div class="lbl">iptables 链</div><div class="val" id="st-ipt">--</div>
        <div class="lbl">DNS 转发</div><div class="val" id="st-dns">--</div>
        <div class="lbl">SOCKS5 目标</div><div class="val" id="st-socks">--</div>
        <div class="lbl">代理接口</div><div class="val" id="st-ifaces">--</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-start" id="btn-start" onclick="doCmd('start')">启动</button>
        <button class="btn btn-stop"  id="btn-stop"  onclick="doCmd('stop')">停止</button>
        <button class="btn btn-restart" id="btn-restart" onclick="doCmd('restart')">重启</button>
        <button class="btn btn-health" id="btn-health" onclick="doCmd('health')">检测</button>
        <button class="btn btn-update" id="btn-update" onclick="updateChnroute()">更新路由表</button>
      </div>
    </div>
  </div>

  <!-- SOCKS5 卡片 -->
  <div class="card">
    <div class="card-title">SOCKS5 服务器</div>
    <div class="card-body">
      <div class="inline-box">
        <input type="text" id="socks5-input" placeholder="192.168.9.250:7890">
        <button class="btn btn-save" onclick="saveSocks5()">保存</button>
      </div>
      <div class="hint">
        已保存: <span id="socks5-saved">--</span>
        &nbsp;|&nbsp; 默认: <span id="socks5-default">192.168.9.250:7890</span>
      </div>
    </div>
  </div>


  <!-- 代理接口卡片 -->
  <div class="card">
    <div class="card-title">代理接口 <span style="font-weight:normal;font-size:11px;color:#8899aa;">(勾选=走代理，留空=全部)</span></div>
    <div class="card-body">
      <div id="ifaces-list" style="max-height:200px;overflow-y:auto;">加载中...</div>
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn btn-update" style="font-size:11px;padding:4px 12px;" onclick="toggleAllIfaces()">全选/取消</button>
        <button class="btn btn-save" onclick="saveIfaces()">保存</button>
      </div>
      <div class="hint" style="margin-top:4px;">已保存: <span id="ifaces-saved">--</span></div>
    </div>
  </div>

  <!-- 输出日志 -->
  <div class="card">
    <div class="card-title">
      命令输出
      <span style="flex:1"></span>
      <button class="btn btn-start" style="padding:2px 8px;font-size:10px;" onclick="clearLog()">清空</button>
    </div>
    <div class="log-area" id="log"></div>
  </div>

</div>

<div class="footer">proxy.sh 控制面板 — pdv 固件</div>

<script>
// ===== 配置 =====
var DEFAULT_SOCKS5 = '192.168.9.250:7890';
var REFRESH_TIMER = null;
var REFRESH_COUNT = 0;


// ===== 初始化 =====
function init() {
    loadSocks5();
    loadIfaces();
    refreshStatus();
    setRefresh();
}

// ===== SOCKS5 =====
function loadSocks5() {
    runCmd('nvram get socks5_proxy', function(out) {
        var v = out.trim(), el = document.getElementById('socks5-saved'), inp = document.getElementById('socks5-input');
        if (v) { el.textContent = v; el.style.color = '#69f0ae'; inp.value = v; }
        else   { el.textContent = '未设置'; el.style.color = '#667'; inp.value = DEFAULT_SOCKS5; }
    });
}
function saveSocks5() {
    var v = document.getElementById('socks5-input').value.trim();
    if (!/^\d+\.\d+\.\d+\.\d+:\d+$/.test(v)) { addLog('格式错误: ' + v, 'err'); return; }
    var b = document.querySelector('#socks5-input + .btn-save'); if(b)b.disabled=true;
    runCmd('nvram set socks5_proxy="' + v + '" && nvram commit && echo "OK"', function(out) {
        addLog('SOCKS5 已保存: ' + v, 'ok');
        document.getElementById('socks5-saved').textContent = v;
        document.getElementById('socks5-saved').style.color = '#69f0ae';
        if(b)b.disabled=false;
    });
}


// ===== 代理接口 =====
var ifaceData = [];
function loadIfaces() {
    runCmd('proxy.sh scan', function(out) {
        ifaceData = [];
        var lines = out.trim().split('\n');
        for (var i = 0; i < lines.length; i++) {
            var p = lines[i].split('|');
            if (p.length >= 2) ifaceData.push({iface:p[0], ssid:p[1]});
        }
        renderIfaces();
    });
    runCmd('nvram get proxy_ifaces', function(out) {
        var v = out.trim(), el = document.getElementById('ifaces-saved');
        if (v) { el.textContent = v; el.style.color = '#69f0ae'; }
        else   { el.textContent = '未设置（全部）'; el.style.color = '#667'; }
    });
}
function renderIfaces() {
    var saved = document.getElementById('ifaces-saved').textContent;
    var sl = (saved.indexOf('全部')>=0||saved.indexOf('未设置')>=0) ? [] : saved.split(',');
    var h = '';
    for (var i = 0; i < ifaceData.length; i++) {
        var d = ifaceData[i], c = (sl.length===0||sl.indexOf(d.iface)>=0)?' checked':'';
        h += '<label style="display:block;padding:2px 0;font-size:13px;cursor:pointer;">' +
            '<input type="checkbox" class="iface-cb" value="'+d.iface+'"'+c+'> ' +
            d.ssid + ' <span style="color:#667;font-size:11px;">('+d.iface+')</span></label>';
    }
    document.getElementById('ifaces-list').innerHTML = h || '无可用接口';
}
function toggleAllIfaces() {
    var cbs = document.querySelectorAll('.iface-cb'), all = true;
    for (var i = 0; i < cbs.length; i++) if (!cbs[i].checked) { all = false; break; }
    for (var i = 0; i < cbs.length; i++) cbs[i].checked = !all;
}
function saveIfaces() {
    var cbs = document.querySelectorAll('.iface-cb'), sel = [];
    for (var i = 0; i < cbs.length; i++) if (cbs[i].checked) sel.push(cbs[i].value);
    var v = sel.join(','), allSel = (sel.length === cbs.length && cbs.length > 0);
    if (allSel || v === '') {
        runCmd('nvram unset proxy_ifaces && nvram commit && echo OK', function(out) {
            addLog('代理接口: 全部', 'ok');
            document.getElementById('ifaces-saved').textContent = '未设置（全部）';
            document.getElementById('ifaces-saved').style.color = '#667'; renderIfaces();
        });
    } else {
        runCmd('nvram set proxy_ifaces="' + v + '" && nvram commit && echo OK', function(out) {
            addLog('代理接口: ' + v, 'ok');
            document.getElementById('ifaces-saved').textContent = v;
            document.getElementById('ifaces-saved').style.color = '#69f0ae'; renderIfaces();
        });
    }
}

// ===== 更新路由表 =====
function updateChnroute() {
    var b = document.getElementById('btn-update'); b.disabled = true;
    addLog('>>> 更新 chnroute ...', '');
    runCmd('proxy.sh update-chnroute', function(out) {
        addLog(out, ''); b.disabled = false; refreshStatus();
    });
}

// ===== 状态解析 =====
function refreshStatus() {
    runCmd('proxy.sh status', function(out) { parseStatus(out); });
}
function parseStatus(out) {
    var lines = out.split('\n'), daemons = {};
    for (var i = 0; i < lines.length; i++) {
        var l = lines[i].trim(); if (!l) continue;
        if (l.startsWith('SOCKS5:')) document.getElementById('st-socks').textContent = l.replace('SOCKS5:','').trim();
        var dm = l.match(/^\s*(chinadns-ng|dns2tcp|ipt2socks)\s*:\s*(RUNNING|STOPPED)/);
        if (dm) daemons[dm[1]] = dm[2];
        var ipm = l.match(/chnroute\s+ipset:\s*(\d+)\s+entries/);
        if (ipm) document.getElementById('st-ipset').textContent = ipm[1] + ' 条';
        var iptm = l.match(/PROXY\s+chain:\s*(\d+)\s+rules/);
        if (iptm) document.getElementById('st-ipt').textContent = iptm[1] + ' 条规则';
        var dnsm = l.match(/DNS\s+fwd:\s*(\d+)/);
        if (dnsm) document.getElementById('st-dns').textContent = dnsm[1] == '1' ? '已启用' : '未启用';
        var ifm = l.match(/Proxied interfaces:\s*(.+)/);
        if (ifm) document.getElementById('st-ifaces').textContent = ifm[1];
    }
    updateBadge('st-cng', daemons['chinadns-ng']);
    updateBadge('st-d2t', daemons['dns2tcp']);
    updateBadge('st-i2s', daemons['ipt2socks']);
    var allRun = daemons['chinadns-ng']==='RUNNING' && daemons['dns2tcp']==='RUNNING' && daemons['ipt2socks']==='RUNNING';
    var anyRun = daemons['chinadns-ng']==='RUNNING' || daemons['dns2tcp']==='RUNNING' || daemons['ipt2socks']==='RUNNING';
    var dot = document.getElementById('global-dot'), gs = document.getElementById('global-status');
    dot.className = 'dot ' + (allRun ? 'green' : anyRun ? 'gray' : 'red');
    gs.textContent = allRun ? '全部运行中' : anyRun ? '部分运行' : '已停止';
    document.getElementById('btn-start').disabled = allRun;
    document.getElementById('btn-stop').disabled = !anyRun;
}
function updateBadge(id, st) {
    var el = document.getElementById(id);
    if (!st) { el.className='badge info'; el.textContent='--'; return; }
    el.className = 'badge ' + (st==='RUNNING'?'ok':'err');
    el.textContent = st==='RUNNING'?'运行中':'已停止';
}

// ===== 命令执行 =====
var cmdQueue=[], cmdRunning=false;
function runCmd(cmd, cb) { cmdQueue.push({cmd:cmd,cb:cb}); processQueue(); }
function processQueue() {
    if (cmdRunning || !cmdQueue.length) return;
    cmdRunning = true; var item = cmdQueue.shift();
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/apply.cgi', true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) setTimeout(function() { fetchOutput(item.cb); }, 800);
    };
    xhr.send('action_mode=+SystemCmd+&current_page=console_response.asp&next_page=console_response.asp&sid_list=syscmd.sh&SystemCmd=' + item.cmd);
}
function fetchOutput(cb) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/console_response.asp?t=' + Date.now(), true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) { if (cb) cb(xhr.responseText || ''); cmdRunning = false; processQueue(); }
    };
    xhr.send();
}

// ===== 操作 =====
function doCmd(action) {
    var b = document.getElementById('btn-' + action); if (b) b.disabled = true;
    addLog('>>> ' + action, '');
    if (action === 'health') {
        runCmd('proxy.sh health', function(out) { addLog(out, ''); if(b)b.disabled=false; refreshStatus(); });
        return;
    }
    var socks = document.getElementById('socks5-input').value.trim() || DEFAULT_SOCKS5;
    var cmd = 'proxy.sh ' + action;
    runCmd(cmd, function(out) { addLog(out, ''); if(b)b.disabled=false; refreshStatus(); });
}
function fixHealthOutput(out) {
    return out.replace(/\[OK\]/g,'<span class="ok">[OK]</span>').replace(/\[FAIL\]/g,'<span class="err">[FAIL]</span>').replace(/\[WARN\]/g,'<span class="warn">[WARN]</span>');
}

// ===== 日志 =====
function addLog(text, cls) {
    var div = document.getElementById('log');
    var line = document.createElement('div');
    line.innerHTML = '<span class="ts">' + new Date().toLocaleTimeString() + '</span> ' + fixHealthOutput(text);
    div.appendChild(line); div.scrollTop = div.scrollHeight;
}
function clearLog() { document.getElementById('log').innerHTML = ''; }

// ===== 自动刷新 =====
function setRefresh() {
    if (REFRESH_TIMER) { clearInterval(REFRESH_TIMER); REFRESH_TIMER = null; }
    var t = parseInt(document.getElementById('refresh-interval').value);
    document.getElementById('countdown').textContent = '';
    REFRESH_COUNT = t;
    if (t > 0) {
        REFRESH_TIMER = setInterval(function() {
            REFRESH_COUNT--;
            document.getElementById('countdown').textContent = REFRESH_COUNT + 's';
            if (REFRESH_COUNT <= 0) { REFRESH_COUNT = t; refreshStatus(); }
        }, 1000);
    }
}

window.onload = init;
</script>
</body>
</html>
