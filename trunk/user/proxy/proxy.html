<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>透明代理控制面板</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;
       background:#1a1a2e; color:#e0e0e0; min-height:100vh; }
.header { background:linear-gradient(135deg,#16213e,#0f3460); padding:12px 20px;
          border-bottom:2px solid #e94560; display:flex; align-items:center; gap:12px; }
.header h1 { font-size:18px; color:#e94560; white-space:nowrap; }
.header .sub { font-size:11px; color:#667; margin-left:4px; }
.header .spacer { flex:1; }
.header .refresh-ctl { display:flex; align-items:center; gap:6px; font-size:12px; color:#8899aa; }
.header .refresh-ctl select { background:#0d1b36; border:1px solid #2a3a5c; color:#e0e0e0;
    padding:2px 6px; border-radius:3px; font-size:11px; }
.header .refresh-ctl .tick { color:#e94560; font-weight:600; min-width:55px; text-align:right; }

.container { max-width:720px; margin:0 auto; padding:10px; }

.card { background:#16213e; border-radius:6px; margin-bottom:10px; overflow:hidden; }
.card-title { background:#0f3460; padding:8px 14px; font-size:13px; font-weight:600;
              display:flex; align-items:center; gap:8px; }
.card-title .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
.card-title .dot.green { background:#00c853; }
.card-title .dot.red   { background:#ff1744; }
.card-title .dot.gray  { background:#666; }
.card-body { padding:10px 14px; }

.grid { display:grid; grid-template-columns:110px 1fr; gap:4px 8px; font-size:13px; }
.grid .lbl { color:#8899aa; }
.grid .val { font-weight:500; }
.badge { padding:1px 8px; border-radius:10px; font-size:11px; font-weight:600; display:inline-block; }
.badge.ok  { background:#1b5e20; color:#69f0ae; }
.badge.err { background:#b71c1c; color:#ff8a80; }
.badge.info{ background:#01579b; color:#81d4fa; }

input, button, select { font-family:inherit; font-size:13px; }
input[type=text] { background:#0d1b36; border:1px solid #2a3a5c; color:#e0e0e0;
                   padding:6px 10px; border-radius:4px; width:100%; }
input[type=text]:focus { border-color:#e94560; outline:none; }

.btn { padding:6px 16px; border:none; border-radius:4px; cursor:pointer; font-weight:600;
       transition:all .15s; font-size:12px; }
.btn:disabled { opacity:.4; cursor:not-allowed; }
.btn-start { background:#2e7d32; color:#fff; }
.btn-start:hover:not(:disabled) { background:#388e3c; }
.btn-stop  { background:#c62828; color:#fff; }
.btn-stop:hover:not(:disabled) { background:#d32f2f; }
.btn-restart { background:#ef6c00; color:#fff; }
.btn-restart:hover:not(:disabled) { background:#f57c00; }
.btn-health { background:#1565c0; color:#fff; }
.btn-health:hover:not(:disabled) { background:#1976d2; }
.btn-update { background:#00695c; color:#fff; }
.btn-update:hover:not(:disabled) { background:#00897b; }
.btn-save { background:#6a1b9a; color:#fff; }
.btn-save:hover:not(:disabled) { background:#7b1fa2; }

.btn-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }

.inline-box { display:flex; gap:6px; align-items:center; }
.inline-box input { flex:1; }
.hint { font-size:11px; color:#667; margin-top:4px; }

.log-area { background:#0a0f1a; border:1px solid #2a3a5c; border-radius:4px;
            padding:8px; font-family:'Courier New',monospace; font-size:11px;
            max-height:250px; overflow-y:auto; white-space:pre-wrap; word-break:break-all; }
.log-area .ts { color:#555; }
.log-area .ok { color:#69f0ae; }
.log-area .err{ color:#ff8a80; }
.log-area .warn{color:#ffd180; }

.footer { text-align:center; padding:12px; color:#444; font-size:10px; }

@media (max-width:480px) {
  .grid { grid-template-columns:85px 1fr; }
  .btn { padding:5px 12px; font-size:11px; }
  .header h1 { font-size:15px; }
  .header .refresh-ctl { font-size:10px; }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>透明代理<span class="sub">chinadns-ng + dns2tcp + ipt2socks</span></h1>
  </div>
  <span class="spacer"></span>
  <div class="refresh-ctl">
    自动刷新
    <select id="refresh-interval" onchange="setRefresh()">
      <option value="0">关闭</option>
      <option value="3" selected>3秒</option>
      <option value="5">5秒</option>
      <option value="10">10秒</option>
      <option value="30">30秒</option>
    </select>
    <span class="tick" id="countdown"></span>
  </div>
</div>

<div class="container">

  <!-- 状态卡片 -->
  <div class="card">
    <div class="card-title">
      <span class="dot gray" id="global-dot"></span>
      <span id="global-status">检测中...</span>
    </div>
    <div class="card-body">
      <div class="grid">
        <div class="lbl">chinadns-ng</div><div class="val"><span class="badge info" id="st-cng">--</span></div>
        <div class="lbl">dns2tcp</div><div class="val"><span class="badge info" id="st-d2t">--</span></div>
        <div class="lbl">ipt2socks</div><div class="val"><span class="badge info" id="st-i2s">--</span></div>
        <div class="lbl">chnroute</div><div class="val" id="st-ipset">--</div>
        <div class="lbl">iptables 链</div><div class="val" id="st-ipt">--</div>
        <div class="lbl">DNS 转发</div><div class="val" id="st-dns">--</div>
        <div class="lbl">SOCKS5 目标</div><div class="val" id="st-socks">--</div>
        <div class="lbl">代理接口</div><div class="val" id="st-ifaces">--</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-start" id="btn-start" onclick="doCmd('start')">启动</button>
        <button class="btn btn-stop"  id="btn-stop"  onclick="doCmd('stop')">停止</button>
        <button class="btn btn-restart" id="btn-restart" onclick="doCmd('restart')">重启</button>
        <button class="btn btn-health" id="btn-health" onclick="doCmd('health')">检测</button>
        <button class="btn btn-update" id="btn-update" onclick="updateChnroute()">更新路由表</button>
      </div>
    </div>
  </div>

  <!-- SOCKS5 卡片 -->
  <div class="card">
    <div class="card-title">SOCKS5 服务器</div>
    <div class="card-body">
      <div class="inline-box">
        <input type="text" id="socks5-input" placeholder="192.168.9.250:7890">
        <button class="btn btn-save" onclick="saveSocks5()">保存</button>
      </div>
      <div class="hint">
        已保存: <span id="socks5-saved">--</span>
        &nbsp;|&nbsp; 默认: <span id="socks5-default">192.168.9.250:7890</span>
      </div>
    </div>
  </div>


  <!-- 代理接口卡片 -->
  <div class="card">
    <div class="card-title">代理接口</div>
    <div class="card-body">
      <div class="inline-box">
        <input type="text" id="ifaces-input" placeholder="留空=全部，多个用逗号分隔，如: eth2,ra0,rax0">
        <button class="btn btn-save" onclick="saveIfaces()">保存</button>
      </div>
      <div class="hint">
        已保存: <span id="ifaces-saved">--</span>
        &nbsp;|&nbsp; 可用: <span id="ifaces-avail">--</span>
      </div>
    </div>
  </div>

  <!-- 输出日志 -->
  <div class="card">
    <div class="card-title">
      命令输出
      <span style="flex:1"></span>
      <button class="btn btn-start" style="padding:2px 8px;font-size:10px;" onclick="clearLog()">清空</button>
    </div>
    <div class="log-area" id="log"></div>
  </div>

</div>

<div class="footer">proxy.sh 控制面板 — pdv 固件</div>

<script>
// ===== 配置 =====
var DEFAULT_SOCKS5 = '192.168.9.250:7890';
var REFRESH_TIMER = null;
var REFRESH_COUNT = 0;


// ===== 初始化 =====
function init() {
    loadSocks5();
    loadIfaces();
    refreshStatus();
    setRefresh();
}

// ===== SOCKS5 =====
function loadSocks5() {
    runCmd('nvram get socks5_proxy', function(out) {
        var v = out.trim(), el = document.getElementById('socks5-saved'), inp = document.getElementById('socks5-input');
        if (v) { el.textContent = v; el.style.color = '#69f0ae'; inp.value = v; }
        else   { el.textContent = '未设置'; el.style.color = '#667'; inp.value = DEFAULT_SOCKS5; }
    });
}
function saveSocks5() {
    var v = document.getElementById('socks5-input').value.trim();
    if (!/^\d+\.\d+\.\d+\.\d+:\d+$/.test(v)) { addLog('格式错误: ' + v, 'err'); return; }
    var b = document.querySelector('#socks5-input + .btn-save'); if(b)b.disabled=true;
    runCmd('nvram set socks5_proxy="' + v + '" && nvram commit && echo "OK"', function(out) {
        addLog('SOCKS5 已保存: ' + v, 'ok');
        document.getElementById('socks5-saved').textContent = v;
        document.getElementById('socks5-saved').style.color = '#69f0ae';
        if(b)b.disabled=false;
    });
}


// ===== 代理接口 =====
function loadIfaces() {
    runCmd('nvram get proxy_ifaces', function(out) {
        var v = out.trim(), el = document.getElementById('ifaces-saved'), inp = document.getElementById('ifaces-input');
        if (v) { el.textContent = v; el.style.color = '#69f0ae'; inp.value = v; }
        else   { el.textContent = '未设置（全部）'; el.style.color = '#667'; inp.value = ''; }
    });
    runCmd("ls /sys/class/net/br0/brif/ 2>/dev/null | tr '\n' ' '", function(out) {
        document.getElementById('ifaces-avail').textContent = out.trim() || '--';
    });
}
function saveIfaces() {
    var v = document.getElementById('ifaces-input').value.trim();
    var b = document.querySelector('#ifaces-input + .btn-save'); if(b)b.disabled=true;
    if (v) {
        runCmd('nvram set proxy_ifaces="' + v + '" && nvram commit && echo OK', function(out) {
            addLog('代理接口: ' + v, 'ok');
            document.getElementById('ifaces-saved').textContent = v;
            document.getElementById('ifaces-saved').style.color = '#69f0ae';
            if(b)b.disabled=false;
        });
    } else {
        runCmd('nvram unset proxy_ifaces && nvram commit && echo OK', function(out) {
            addLog('代理接口: 全部', 'ok');
            document.getElementById('ifaces-saved').textContent = '未设置（全部）';
            document.getElementById('ifaces-saved').style.color = '#667';
            if(b)b.disabled=false;
        });
    }
}

// ===== 更新路由表 =====
function updateChnroute() {
    var b = document.getElementById('btn-update'); b.disabled = true;
    addLog('>>> 从 APNIC 下载路由表 ...', '');
    var cmd = 'mkdir -p /etc/storage/chinadns && ' +
        'curl -sk --connect-timeout 15 --retry 2 ' +
        '"http://ftp.apnic.net/apnic/stats/apnic/delegated-apnic-latest" | ' +
        'awk \'/CN\\|ipv4/ { printf(\"%s/%d\\n\", $4, 32-log($5)/log(2)) }\' ' +
        '> /etc/storage/chinadns/chnroute.txt && ' +
        'echo "已下载 $(wc -l < /etc/storage/chinadns/chnroute.txt) 条 CIDR" && ' +
        'if ipset list chnroute >/dev/null 2>&1; then ' +
        '  ipset destroy chnroute 2>/dev/null; ' +
        '  (echo "create chnroute hash:net"; ' +
        '   sed "s/^/add chnroute /" /etc/storage/chinadns/chnroute.txt) ' +
        '  | ipset restore && echo "ipset 已热加载"; ' +
        'fi';
    runCmd(cmd, function(out) {
        addLog(out, ''); b.disabled = false; refreshStatus();
    });
}

// ===== 状态解析 =====
function refreshStatus() {
    runCmd('proxy.sh status', function(out) { parseStatus(out); });
}
function parseStatus(out) {
    var lines = out.split('\n'), daemons = {};
    for (var i = 0; i < lines.length; i++) {
        var l = lines[i].trim(); if (!l) continue;
        if (l.startsWith('SOCKS5:')) document.getElementById('st-socks').textContent = l.replace('SOCKS5:','').trim();
        var dm = l.match(/^\s*(chinadns-ng|dns2tcp|ipt2socks)\s*:\s*(RUNNING|STOPPED)/);
        if (dm) daemons[dm[1]] = dm[2];
        var ipm = l.match(/chnroute\s+ipset:\s*(\d+)\s+entries/);
        if (ipm) document.getElementById('st-ipset').textContent = ipm[1] + ' 条';
        var iptm = l.match(/PROXY\s+chain:\s*(\d+)\s+rules/);
        if (iptm) document.getElementById('st-ipt').textContent = iptm[1] + ' 条规则';
        var dnsm = l.match(/DNS\s+fwd:\s*(\d+)/);
        if (dnsm) document.getElementById('st-dns').textContent = dnsm[1] == '1' ? '已启用' : '未启用';
        var ifm = l.match(/Proxied interfaces:\s*(.+)/);
        if (ifm) document.getElementById('st-ifaces').textContent = ifm[1];
    }
    updateBadge('st-cng', daemons['chinadns-ng']);
    updateBadge('st-d2t', daemons['dns2tcp']);
    updateBadge('st-i2s', daemons['ipt2socks']);
    var allRun = daemons['chinadns-ng']==='RUNNING' && daemons['dns2tcp']==='RUNNING' && daemons['ipt2socks']==='RUNNING';
    var anyRun = daemons['chinadns-ng']==='RUNNING' || daemons['dns2tcp']==='RUNNING' || daemons['ipt2socks']==='RUNNING';
    var dot = document.getElementById('global-dot'), gs = document.getElementById('global-status');
    dot.className = 'dot ' + (allRun ? 'green' : anyRun ? 'gray' : 'red');
    gs.textContent = allRun ? '全部运行中' : anyRun ? '部分运行' : '已停止';
    document.getElementById('btn-start').disabled = allRun;
    document.getElementById('btn-stop').disabled = !anyRun;
}
function updateBadge(id, st) {
    var el = document.getElementById(id);
    if (!st) { el.className='badge info'; el.textContent='--'; return; }
    el.className = 'badge ' + (st==='RUNNING'?'ok':'err');
    el.textContent = st==='RUNNING'?'运行中':'已停止';
}

// ===== 命令执行 =====
var cmdQueue=[], cmdRunning=false;
function runCmd(cmd, cb) { cmdQueue.push({cmd:cmd,cb:cb}); processQueue(); }
function processQueue() {
    if (cmdRunning || !cmdQueue.length) return;
    cmdRunning = true; var item = cmdQueue.shift();
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/apply.cgi', true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) setTimeout(function() { fetchOutput(item.cb); }, 800);
    };
    xhr.send('action_mode=+SystemCmd+&current_page=console_response.asp&next_page=console_response.asp&sid_list=syscmd.sh&SystemCmd=' + item.cmd);
}
function fetchOutput(cb) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/console_response.asp?t=' + Date.now(), true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) { if (cb) cb(xhr.responseText || ''); cmdRunning = false; processQueue(); }
    };
    xhr.send();
}

// ===== 操作 =====
function doCmd(action) {
    var b = document.getElementById('btn-' + action); if (b) b.disabled = true;
    addLog('>>> ' + action, '');
    if (action === 'health') {
        runCmd('proxy.sh health', function(out) { addLog(out, ''); if(b)b.disabled=false; refreshStatus(); });
        return;
    }
    var socks = document.getElementById('socks5-input').value.trim() || DEFAULT_SOCKS5;
    var cmd = 'proxy.sh ' + action;
    runCmd(cmd, function(out) { addLog(out, ''); if(b)b.disabled=false; refreshStatus(); });
}
function fixHealthOutput(out) {
    return out.replace(/\[OK\]/g,'<span class="ok">[OK]</span>').replace(/\[FAIL\]/g,'<span class="err">[FAIL]</span>').replace(/\[WARN\]/g,'<span class="warn">[WARN]</span>');
}

// ===== 日志 =====
function addLog(text, cls) {
    var div = document.getElementById('log');
    var line = document.createElement('div');
    line.innerHTML = '<span class="ts">' + new Date().toLocaleTimeString() + '</span> ' + fixHealthOutput(text);
    div.appendChild(line); div.scrollTop = div.scrollHeight;
}
function clearLog() { document.getElementById('log').innerHTML = ''; }

// ===== 自动刷新 =====
function setRefresh() {
    if (REFRESH_TIMER) { clearInterval(REFRESH_TIMER); REFRESH_TIMER = null; }
    var t = parseInt(document.getElementById('refresh-interval').value);
    document.getElementById('countdown').textContent = '';
    REFRESH_COUNT = t;
    if (t > 0) {
        REFRESH_TIMER = setInterval(function() {
            REFRESH_COUNT--;
            document.getElementById('countdown').textContent = REFRESH_COUNT + 's';
            if (REFRESH_COUNT <= 0) { REFRESH_COUNT = t; refreshStatus(); }
        }, 1000);
    }
}

window.onload = init;
</script>
</body>
</html>
